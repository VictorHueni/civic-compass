name: Contrôle des liens
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # chaque lundi
jobs:
  liens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: js/donnees.js correspond à data/*.json
        run: python3 tools/boussole.py generer --verifier
      # Même outil qu'en local. Les anciennes_urls ne sont pas testées ;
      # 403 et 429 (sites qui bloquent les robots) ne font pas échouer.
      - name: Vérifier les liens actuels de data/*.json
        run: python3 tools/boussole.py liens
